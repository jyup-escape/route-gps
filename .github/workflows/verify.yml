name: Verify Android build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Download official SDK and JDK
        run: python setup_tools.py
      - name: Test, compile and verify test-signed APK
        run: python build.py
      # This ephemeral CI signature is not used for official upgrade APKs.
